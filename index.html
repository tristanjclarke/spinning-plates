<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spinning Plates</title>
<meta name="description" content="A calm daily planner. Spin the plates that matter, on purpose.">
<meta name="theme-color" content="#F5F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plates">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first, 8px grid. Bottom nav: Now, Plates, Pause; gear opens Settings. Now fits one screen: header, day gauge, current block checklist, next, practice. Details open in bottom sheets. Celebrations take the whole screen. Colour = plate family. */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --ink:#24223A; --mute:#6E6B85; --line:#E3E1EE; --tint:#EDEBF6;
  --accent:#5B57C9; --accent-ink:#FFFFFF; --scrim:rgb(36 34 58/.32); --on-c:#1B1A28;
  --rest:#7A77DD; --people:#E2707A; --self:#2E9C8F; --work:#D9962E; --home:#7FA35B; --other:#A6A3BA;
  --f-fear:#B39BE0; --f-anger:#E88B80; --f-sad:#86AEE6; --f-shame:#8FC49A; --f-joy:#EDCF62; --f-spark:#F2AA74;
  --font:"Figtree","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131F; --surface:#1E1D2D; --ink:#ECEBF5; --mute:#A09DB8; --line:#2E2C42; --tint:#28263A;
  --accent:#A9A6F7; --accent-ink:#14131F; --scrim:rgb(0 0 0/.5); --on-c:#14131F;
  --rest:#9D9AF2; --people:#F2939A; --self:#5CC6B8; --work:#EDB65E; --home:#A4C67F; --other:#6F6C88;
  --f-fear:#B9A1EA; --f-anger:#EE8E84; --f-sad:#88B0EA; --f-shame:#90C79B; --f-joy:#EBCB61; --f-spark:#F3AC78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131F; --surface:#1E1D2D; --ink:#ECEBF5; --mute:#A09DB8; --line:#2E2C42; --tint:#28263A;
  --accent:#A9A6F7; --accent-ink:#14131F; --scrim:rgb(0 0 0/.5); --on-c:#14131F;
  --rest:#9D9AF2; --people:#F2939A; --self:#5CC6B8; --work:#EDB65E; --home:#A4C67F; --other:#6F6C88;
  --f-fear:#B9A1EA; --f-anger:#EE8E84; --f-sad:#88B0EA; --f-shame:#90C79B; --f-joy:#EBCB61; --f-spark:#F3AC78; color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/24px var(--font);padding-inline:16px;padding-block:16px 96px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.spin{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px var(--pc)}
.spin .lbl{display:inline-flex;align-items:center;gap:8px;font:600 14px/24px var(--font);color:var(--mute)}
.spin .pl.mini{width:24px;height:24px}
.sname{font:700 24px/32px var(--font)}
.clock{font:700 48px/56px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pbar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pc);transition:width .4s}
.hint{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;border:0;border-radius:24px;background:var(--surface);padding:8px 16px;text-align:left}
.hint span{flex:1;min-width:0}
.hint small{display:block;font:500 14px/16px var(--font);color:var(--mute)}
.hint b{display:block;font:600 16px/24px var(--font)}
.hint svg{width:24px;height:24px;color:var(--mute)}
.strip{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 14px/24px var(--font);color:var(--mute);font-variant-numeric:tabular-nums}
.strip span{display:inline-flex;gap:8px;align-items:center}
.strip svg{width:16px;height:16px;color:var(--work)}
.overb{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--tint);padding:8px 16px;text-align:left;color:var(--ink)}
.overb span{flex:1}
.overb b{display:block;font:600 14px/24px var(--font)}
.overb small{display:block;font:500 14px/16px var(--font);color:var(--accent)}
.overb svg{width:24px;height:24px;color:var(--mute)}
.tile.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pl.spinning{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome{min-height:calc(100vh - 200px);min-height:calc(100dvh - 200px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;max-width:360px;margin-inline:auto}
.art{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:112px}
.art svg{width:64px;height:64px}
.art span:nth-child(2) svg{width:96px;height:96px}
.signedout .nav,.signedout #sheet{display:none}
.signedout .welcome{width:100%;min-height:calc(100dvh - 32px)}
.prow3{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:72px;border-bottom:1px solid var(--line)}
.prow3:last-child{border-bottom:0}
.prow3.on{background:var(--surface);border-radius:16px;border-bottom-color:transparent;box-shadow:inset 0 0 0 2px var(--pc);padding-right:8px}
.pspin{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:center;border:0;background:none;padding:8px;text-align:left;min-width:0;border-radius:16px}
.pspin svg{width:48px;height:48px}
.pt{display:flex;flex-direction:column;gap:4px;min-width:0}
.pt b{font:600 16px/24px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt small{font:500 12px/16px var(--font);color:var(--mute);font-variant-numeric:tabular-nums}
.pbar.sm{height:4px;border-radius:2px}
.prow3.dn .pt b,.prow3.dn .tgt .v{color:var(--mute)}
.tgt{display:grid;grid-template-columns:40px 56px 40px;align-items:center}
.tgt .ibtn{width:40px;height:40px;background:var(--tint)}
.tgt .ibtn svg{width:20px;height:20px}
.tgt .v{text-align:center;font:700 14px/16px var(--font);font-variant-numeric:tabular-nums}
.uw{display:grid;grid-template-columns:40px 48px 64px 48px 1fr;gap:8px;align-items:center;min-height:56px}
.uw .v{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.uw input{min-height:40px;padding:4px 8px}
.wsr{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;align-items:center;min-height:56px;border-bottom:1px solid var(--line)}
.wsr input{min-height:40px;padding:4px 8px}
.adj{display:grid;grid-template-columns:16px 1fr 48px 72px 48px;gap:8px;align-items:center;min-height:64px;border-bottom:1px solid var(--line)}
.adj:last-child{border-bottom:0}
.adj .nm{min-width:0;font-weight:600}
.adj .nm small{display:block;font:500 12px/16px var(--font);color:var(--mute)}
.adj .v{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.adj.dn .nm,.adj.dn .v{color:var(--mute)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
svg{display:block}
main{max-width:480px;margin-inline:auto}
.page{display:flex;flex-direction:column;gap:24px}
.topr{display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:8px}
.date{font:600 14px/24px var(--font);color:var(--mute)}
.tr{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:8px;font:600 14px/24px var(--font);color:var(--mute)}
.streak svg{width:16px;height:16px;color:var(--accent)}
h1{font:700 32px/40px var(--font);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 14px/24px var(--font);color:var(--mute);margin:0}
.mute{color:var(--mute)}
.small{font-size:14px;line-height:24px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec.tight{gap:8px}
.hd{display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:8px}
.card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:16px}
.btn{min-height:48px;padding:0 24px;border-radius:16px;border:0;background:var(--tint);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:24px;height:24px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:40px;padding:0 16px;border-radius:16px;font-size:14px}
.link{border:0;background:none;min-height:48px;padding:0 8px;font-weight:600;color:var(--accent)}
.ibtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--tint);display:grid;place-items:center;padding:0;flex:none}
.ibtn svg{width:24px;height:24px}
.ibtn.ghost{background:none}
.ibtn:disabled{opacity:.35}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts.split>*{flex:1}
.pillb{min-height:40px;padding:0 16px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font:600 14px/16px var(--font);display:inline-flex;align-items:center;gap:8px}
.pillb svg{width:16px;height:16px}
/* now */
.now{display:flex;flex-direction:column;gap:16px;height:calc(100vh - 104px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 104px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:600px}
.ring{position:relative;width:min(272px,100%);width:min(272px,100%,34dvh);aspect-ratio:1;margin-inline:auto;flex:none}
.ring svg{width:100%;height:100%}
.ring text{fill:var(--mute);font:600 12px var(--font)}
.ring text.aw{fill:var(--ink)}
.ctr{position:absolute;inset:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.ctr .t{font:700 24px/32px var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.ctr .s{font:500 14px/16px var(--font);color:var(--mute);font-variant-numeric:tabular-nums}
.ctr .a{font:600 12px/16px var(--font);color:var(--mute);display:flex;gap:4px;align-items:center}
.ctr .a svg{width:16px;height:16px;color:var(--work)}
.nowmark{animation:beat 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{50%{transform:scale(1.25)}}
.bc{flex:1;min-height:0;background:var(--surface);border-radius:24px;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.bc .scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:16px;padding:4px;gap:4px;margin-top:8px}
.seg button{min-height:40px;border:0;border-radius:12px;background:none;font:600 14px/16px var(--font);color:var(--mute)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.desc{font:500 14px/24px var(--font);color:var(--mute);padding-top:8px}
.item{display:grid;grid-template-columns:48px 1fr;align-items:center;min-height:48px;width:100%;border:0;background:none;padding:0;text-align:left}
.item::before{content:"";width:24px;height:24px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;justify-self:center}
.item[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);animation:pop .4s ease-out}
.item[aria-pressed="true"] span{color:var(--mute);text-decoration:line-through}
.item .sub{display:flex;align-items:center;gap:8px;min-width:0}
.item .sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item svg{width:16px;height:16px;color:var(--mute);flex:none}
.trow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;min-height:48px}
.trow .chkb{width:48px;height:48px;border:0;background:none;padding:0;display:grid;place-items:center}
.trow .chkb::before{content:"";width:24px;height:24px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.trow .chkb[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);animation:pop .4s ease-out}
.trow.done .rt{color:var(--mute);text-decoration:line-through}
.rt{border:0;background:none;padding:0;text-align:left;min-height:48px;min-width:0;display:flex;align-items:center;gap:8px}
.rt .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.rt .tx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .tx small{font:500 14px/16px var(--font);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .meta{font:500 12px/16px var(--font);color:var(--mute);white-space:nowrap;padding-left:8px}
.trow .lic{width:48px;height:48px;display:grid;place-items:center;color:var(--mute)}
.trow .lic svg{width:24px;height:24px}
.rt svg{width:16px;height:16px;color:var(--mute);flex:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.prio{border:0;border-radius:16px;min-height:32px;padding:0 16px;font:600 12px/16px var(--font);background:var(--tint)}
.prio.p1{background:var(--accent);color:var(--accent-ink)}
.nextr{display:grid;grid-template-columns:auto 16px 1fr 24px;gap:8px 16px;align-items:center;min-height:48px;width:100%;border:0;background:var(--surface);border-radius:16px;padding:0 16px;text-align:left;flex:none}
.nextr svg{width:24px;height:24px;color:var(--mute)}
.prow{display:flex;align-items:center;gap:16px;flex:none}
.pb{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.pb svg{width:24px;height:24px}
.pb.done{background:var(--accent);color:var(--accent-ink)}
.prow .mute{margin-left:auto;font:600 14px/24px var(--font)}
.dot{width:16px;height:16px;border-radius:50%;display:block;flex:none}
.dot.s{width:8px;height:8px}
.tm{font:500 14px/24px var(--font);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ti{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* lists */
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:auto 16px 1fr 24px;gap:16px;align-items:center;min-height:56px;width:100%;border:0;background:none;padding:0;text-align:left;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow svg{width:24px;height:24px;color:var(--mute)}
.lrow .ti small{display:block;font:500 14px/16px var(--font);color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.srow{display:grid;grid-template-columns:48px 1fr 24px;gap:16px;align-items:center;min-height:64px;width:100%;border:0;background:var(--surface);border-radius:24px;padding:8px 16px;text-align:left}
.srow .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.srow svg{width:24px;height:24px}
.srow b{display:block;font:600 16px/24px var(--font)}
.srow small{display:block;font:400 14px/16px var(--font);color:var(--mute)}
.prow2{display:grid;grid-template-columns:1fr 48px 48px;gap:8px;align-items:center;min-height:56px;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:0}
.prow2 .rt{gap:16px}
/* plates */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:24px;padding:16px 8px;min-width:0}
.tile svg{width:64px;height:64px}
.tile b{font:600 14px/16px var(--font);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font:500 14px/16px var(--font);color:var(--mute);font-variant-numeric:tabular-nums}
.tile.dn{background:transparent;border:2px dashed var(--line)}
.pl.s1{animation:wob 5s ease-in-out infinite;--amp:2deg}
.pl.s2{animation:wob 3s ease-in-out infinite;--amp:4deg}
@keyframes wob{0%,100%{transform:rotate(calc(var(--amp)*-1))}50%{transform:rotate(var(--amp))}}
.big{font:700 40px/48px var(--font);font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--mute);font-weight:600}
.big.over{color:var(--people)}
.bar{display:flex;height:24px;border-radius:8px;overflow:hidden;background:var(--tint)}
.bar i{display:block;height:100%}
.bar i.free{background:repeating-linear-gradient(45deg,var(--tint) 0 4px,var(--line) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font:500 14px/24px var(--font)}
.legend span{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav .in{max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr)}
/* tasks + ai */
.aib{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;border:0;border-radius:24px;padding:8px 16px;background:var(--surface);color:var(--ink);text-align:left}
.aib .ic{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.aib svg{width:24px;height:24px}
.aib b{display:block;font:600 16px/24px var(--font)}
.aib small{display:block;font:500 14px/16px var(--font);color:var(--mute)}
.seg3{grid-template-columns:1fr 1fr 1fr;margin-top:0}
.lrow .meta{font:500 12px/16px var(--font);color:var(--mute);text-align:right;white-space:nowrap}
.sugg{background:var(--tint);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sugg b{font:600 16px/24px var(--font)}
.sugg .row2{display:flex;flex-wrap:wrap;gap:8px}
.sel{display:grid;grid-template-columns:48px 1fr;align-items:center;min-height:56px;width:100%;border:0;background:none;padding:0;text-align:left}
.sel::before{content:"";width:24px;height:24px;border-radius:8px;border:2px solid var(--line);box-sizing:border-box;justify-self:center}
.sel[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.sel b{display:block;font:500 16px/24px var(--font)}
.sel small{display:block;font:400 14px/16px var(--font);color:var(--mute)}
.think{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;background:var(--tint)}
.think i{width:16px;height:16px;border-radius:50%;background:var(--accent);animation:beat 1.2s ease-in-out infinite;flex:none}
.warn{background:var(--tint);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
/* unwind */
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idea{min-height:72px;border:0;border-radius:16px;background:var(--surface);padding:8px 16px;text-align:left;font:500 14px/16px var(--font);display:flex;align-items:center;justify-content:space-between;gap:8px}
.idea svg{width:16px;height:16px;color:var(--mute);flex:none}
.idea.new{box-shadow:inset 0 0 0 2px var(--accent)}
.nav button{border:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px/16px var(--font);color:var(--mute)}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.scrim.open{animation:fadein .2s}
.sheet.open{animation:up .25s ease-out}

  var em=val('au-email'),pe=document.getElementById('au-pass'),pw=pe?pe.value:'',go=document.getElementById('au-go');
  if(authMode!=='newpass'&&!/.+@.+\..+/.test(em)){authMsg='Enter my email address.';renderAuth();return}
  if(authMode!=='reset'&&pw.length<8){authMsg='Use at least 8 characters for the password.';renderAuth();var e1=document.getElementById('au-email');if(e1)e1.value=em;return}
  authBusy=true;if(go){go.disabled=true;go.textContent='One moment…'}
  var done=function(msg){authBusy=false;authMsg=msg||'';renderAuth();var e2=document.getElementById('au-email');if(e2)e2.value=em};
  var p;
  if(authMode==='signin')p=SB.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error)done(friendly(r.error));else authBusy=false});
  else if(authMode==='signup')p=SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here()}}).then(function(r){if(r.error)return done(friendly(r.error));if(!r.data.session){authMode='signin';done('Nearly there. Check my email for a confirmation link, then sign in here.')}else authBusy=false});
  else if(authMode==='reset')p=SB.auth.resetPasswordForEmail(em,{redirectTo:here()}).then(function(r){done(r.error?friendly(r.error):'If that email has an account, a reset link is on its way.')});
  else p=SB.auth.updateUser({password:pw}).then(function(r){if(r.error)return done(friendly(r.error));authBusy=false;authMode='signin';authMsg='';if(r.data&&r.data.user)startUser(r.data.user);toast('Password updated')});
  p.catch(function(){done('Can’t reach the server. Check the connection and try again.')});
}
function signOut(){
  var u=UID,go=function(){
    if(u&&!writing&&!Object.keys(pend).some(function(k){return pend[k]}))Object.keys(KEYS).forEach(function(k){try{localStorage.removeItem('sp.'+u+'.'+k);localStorage.removeItem('sp.'+u+'.'+k+'.at')}catch(e){}});
    SB.auth.signOut();
  };
  clearTimeout(timer);flush();setTimeout(go,writing?1500:0);
}
function exportJSON(){return JSON.stringify({app:'spinning-plates',v:1,at:new Date().toISOString(),s:S,j:J,t:T,p:P})}
function importJSON(txt){
  var d;try{d=JSON.parse(txt)}catch(e){return 'That doesn’t look like exported data.'}
  if(!d||d.app!=='spinning-plates'||!valid('s',d.s))return 'That doesn’t look like exported data.';
  S=d.s;if(valid('j',d.j))J=d.j;if(valid('p',d.p))P=d.p;if(valid('t',d.t)&&d.t.date===iso())T=d.t;
  Object.keys(KEYS).forEach(function(k){persist(k)});upgradeAll();ensureToday();
  return '';
}
function renderAccount(){
  var h='<div class="page">'+backRow('','spage','')+'<div class="sec tight"><h1>Account</h1><p class="mute">Signed in as '+esc(EMAIL)+'.</p></div>';
  h+='<p class="note">'+(syncState?esc(syncState):(pulled?'Saved to my account. Only I can see it.':'Connecting…'))+'</p>';
  h+='<section class="sec tight"><h2>Move data in</h2><p class="mute small">From the old version: Settings → Move to the new app → Copy my data. Then paste it here.</p><textarea id="imp-txt" placeholder="Paste my data here"></textarea><button class="btn" data-act="impgo">Import and replace</button></section>';
  h+='<section class="sec tight"><h2>Back up</h2><button class="btn" data-act="expgo">Copy my data</button></section>';
  h+='<button class="btn wide" data-act="signout">Sign out</button>';
  return h+'</div>';

function copyText(txt){

  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}

function setupScreen(){
  document.body.classList.add('signedout');
  document.getElementById('view').innerHTML='<div class="page"><div class="welcome">'+artHTML()+'<div class="sec tight" style="text-align:center"><h1>Almost ready</h1><p class="mute">This app isn’t connected to its database yet. Add the Supabase URL and anon key to config.js.</p></div></div></div>';
}
function boot(){
  var cfg=window.SP_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){setupScreen();return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sp-auth'}});
  SB.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){authMode='newpass';authMsg='';UID=null;renderAuth();return}
    if(session&&session.user){if(authMode!=='newpass')startUser(session.user)}
    else{UID=null;EMAIL='';pulled=false;renderAuth()}
  });
  SB.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s&&authMode!=='newpass')startUser(s.user);else if(!UID)renderAuth()},function(){renderAuth()});
  document.addEventListener('visibilitychange',function(){if(!UID)return;if(document.visibilityState==='visible')pull();else{clearTimeout(timer);flush()}});
  setInterval(function(){if(UID&&document.visibilityState==='visible'&&!busy()&&!sheet)pull()},60000);
  document.addEventListener('submit',function(ev){if(ev.target&&ev.target.id==='auth'){ev.preventDefault();doAuth()}});
}

function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')}
function busy(){return typing()||D.phase==='anim'||SIT.run||!!document.querySelector('.cel')}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function byId(id){return S.plates.filter(function(p){return p.id===id})[0]}
function fam(id){var p=byId(id);return id==='sleep'?'rest':p?(p.fam||FAM[id]||'other'):'other'}
function col(id){return 'var(--'+fam(id)+')'}
function sname(id){var p=byId(id);if(!p)return '';return SHORT[id]&&p.name===DEFAULT_PLATES.filter(function(x){return x.id===id}).map(function(x){return x.name})[0]?SHORT[id]:p.name}
function fmt(n){return (Math.round(n*2)/2).toString()}
function hm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function mins(t){var a=String(t||'0:0').split(':');return (parseInt(a[0],10)||0)*60+(parseInt(a[1],10)||0)}
function dur(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?' '+r+'m':'')):(r+'m')}
function nowM(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function fcol(f){for(var i=0;i<CORES.length;i++){var c=CORES[i];if(c.n===f||(S.feel[c.k]||[]).indexOf(f)>-1)return 'var('+c.c+')'}return 'var(--line)'}
function pol(cx,cy,r,a){var t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
function P2(p){return p[0].toFixed(2)+' '+p[1].toFixed(2)}
function arc(cx,cy,r,a0,a1){return 'M'+P2(pol(cx,cy,r,a0))+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+P2(pol(cx,cy,r,a1))}
function dayLabel(dt){var t=iso(),y=addDays(t,-1),tm=addDays(t,1);return dt===t?'Today':dt===y?'Yesterday':dt===tm?'Tomorrow':new Date(dt+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}

/* ---------- routine maths ---------- */
function routine(dw){return (S.week&&S.week[String(dw)])||{wake:usualWS(dw).wake,sleep:usualWS(dw).sleep,blocks:[]}}
function todayR(){return (T&&T.planEdited&&T.plan)?T.plan:routine(new Date().getDay())}
function routineFor(d){if(d==='today'){if(!T.planEdited||!T.plan){T.plan=clone(routine(new Date().getDay()));T.planEdited=true}return T.plan}return routine(d)}
function persistD(d){persist(d==='today'?'t':'s')}
function dayShape(r){
  var bl=r.blocks.slice().sort(function(a,b){return mins(a.start)-mins(b.start)});
  var start=mins(r.wake),end=mins(r.sleep);if(end<=start)end+=1440;
  var segs=[];
  bl.forEach(function(b,i){
    var s=mins(b.start);if(s<start||s>=end)return;
    var nx=null;for(var j=i+1;j<bl.length;j++){if(mins(bl[j].start)>s){nx=bl[j];break}}
    var e=nx?Math.min(mins(nx.start),end):end;
    if(e>s)segs.push({b:b,s:s,e:e});
  });
  return {start:start,end:end,segs:segs};
}
function dayModel(){
  var m=dayShape(todayR()),now=nowM();
  if(m.end>1440&&now<m.start)now+=1440;
  m.now=now;m.cur=m.segs.filter(function(x){return x.s<=now&&now<x.e})[0]||null;
  return m;
}
function awakeH(){var t=0;for(var d=0;d<7;d++){var m=dayShape(routine(d));t+=(m.end-m.start)/60}return t}
function routineH(id){var t=0;for(var d=0;d<7;d++){dayShape(routine(d)).segs.forEach(function(x){if(x.b.plate===id)t+=(x.e-x.s)/60})}return t}
function syncSleep(){var sp=byId('sleep');if(sp){var h=Math.round((168-awakeH())*2)/2;sp.hours=h;sp.base=h;sp.floor=Math.min(sp.floor,h);sp.down=false}}

/* ---------- plate maths ---------- */
function usedNS(){return S.plates.reduce(function(a,p){return a+(p.down||p.id==='sleep'?0:p.hours)},0)}
function freeH(){return awakeH()-S.overhead-usedNS()}
function raise(id,want){
  var p=byId(id),need=want,rep={took:[],fromFree:0,added:0,short:0};
  var f=Math.min(Math.max(0,freeH()),need);need-=f;rep.fromFree=f;
  for(var i=S.plates.length-1;i>=0&&need>0;i--){
    var q=S.plates[i];
    if(q.id===id||q.down||q.id==='sleep')continue;
    var give=Math.min(q.hours-q.floor,need);
    if(give>0){q.hours-=give;need-=give;rep.took.push({id:q.id,amt:give})}
  }
  rep.added=want-need;rep.short=need;p.hours+=rep.added;
  return rep;
}
function describe(rep){
  if(rep.short>0&&rep.added===0)return 'No time to take. Put a plate down first.';
  var bits=[];
  if(rep.fromFree>0)bits.push('free time');
  rep.took.forEach(function(t){bits.push(sname(t.id)+' −'+fmt(t.amt)+'h')});
  return bits.length?'From '+bits.join(', '):'';
}
function strain(p){return p.down?'dn':p.id==='sleep'?'s0':p.hours<=p.floor&&p.hours<p.base?'s2':p.hours<p.base?'s1':'s0'}
function plateSVG(p){
  var C=2*Math.PI*22,r=p.down?0:Math.min(1,p.hours/Math.max(p.base,0.5)),c=col(p.id);
  return '<svg class="pl '+strain(p)+'" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--surface)" stroke="var(--line)" stroke-width="2"'+(p.down?' stroke-dasharray="4 4"':'')+'/><circle cx="32" cy="32" r="22" fill="none" stroke="var(--tint)" stroke-width="8"/>'+(r>0?'<circle cx="32" cy="32" r="22" fill="none" stroke="'+c+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*r).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 32 32)"/>':'')+'<circle cx="32" cy="32" r="12" fill="var(--tint)"/></svg>';
}

/* ---------- tasks ---------- */
function ruleOf(r){return r.rule||{t:'w',days:r.days||[]}}
function isDue(r,ds){
  var u=ruleOf(r),d=new Date(ds+'T12:00');
  if(r.from&&ds<r.from)return false;
  if(u.t==='w')return (u.days||[]).indexOf(d.getDay())>-1;
  if(u.t==='m'){var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(u.dom,last)}
  if(u.t==='ml'){if(d.getDay()!==u.dow)return false;var n=new Date(d);n.setDate(n.getDate()+7);return n.getMonth()!==d.getMonth()}
  if(u.t==='n'){var f=new Date((r.from||ds)+'T12:00'),diff=(d.getFullYear()-f.getFullYear())*12+d.getMonth()-f.getMonth();return diff>=0&&diff%u.n===0&&d.getDate()===f.getDate()}
  if(u.t==='y')return ds.slice(5)===u.md;
  return false;
}
function nextDue(r){
  var d=iso(),best='';
  for(var i=0;i<800;i++){var ds=addDays(d,i);if(isDue(r,ds)&&!S.moves[r.id+'|'+ds]){best=ds;break}}
  Object.keys(S.moves).forEach(function(k){var v=S.moves[k];if(k.split('|')[0]===r.id&&v!=='skip'&&v>=d&&(!best||v<best))best=v});
  return best;
}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function repLabel(r){
  var u=ruleOf(r);
  if(u.t==='w'){var s=(u.days||[]).slice().sort().join(',');if(u.days.length===7)return 'Every day';if(s==='1,2,3,4,5')return 'Weekdays';if(s==='0,6')return 'Weekends';return 'Every '+WORDER.filter(function(d){return u.days.indexOf(d)>-1}).map(function(d){return WD[d]}).join(', ')}
  if(u.t==='m')return 'Monthly on the '+ord(u.dom);
  if(u.t==='ml')return 'Last '+WD[u.dow]+' of the month';
  if(u.t==='n')return 'Every '+u.n+' months';
  if(u.t==='y')return 'Yearly, '+new Date('2000-'+u.md+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return '';
}
var STOPW=['the','and','for','with','into','from','some','this','that','set','get','out','look','find','sort','add'];
function words(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w.length>2&&STOPW.indexOf(w)<0}).map(function(w){return w.replace(/s$/,'')})}
function sim(a,b){var A=words(a),B=words(b);if(!A.length||!B.length)return 0;var n=A.filter(function(w){return B.indexOf(w)>-1}).length;return n/Math.min(A.length,B.length)}
function findDup(title,skipId){
  var best=null,score=0;
  S.tasks.forEach(function(t){if(t.done||t.id===skipId)return;var s=sim(title,t.title);if(s>score){score=s;best={kind:'t',id:t.id,title:t.title}}});
  S.recurring.forEach(function(r){if(r.id===skipId)return;var s=sim(title,r.title);if(s>score){score=s;best={kind:'r',id:r.id,title:r.title}}});
  return score>=0.6?best:null;
}
function laterTasks(){var d=iso();return S.tasks.filter(function(t){return !t.done&&(!t.date||t.date>d)}).sort(function(a,b){return ((a.date||'9')<(b.date||'9')?-1:(a.date||'9')>(b.date||'9')?1:0)||(a.pr-b.pr)||(plateRank(a.plate)-plateRank(b.plate))})}
function plateRank(id){var i=S.plates.findIndex(function(p){return p.id===id});return i<0?99:i}
function dueToday(){
  var d=iso(),out=[];
  S.recurring.forEach(function(r){
    if(isDue(r,d)){var k=r.id+'|'+d;if(!S.moves[k])out.push({kind:'r',r:r,key:k,title:r.title,plate:r.plate,pr:r.pr||2,done:!!T.rdone[k]})}
  });
  Object.keys(S.moves).forEach(function(k){
    if(S.moves[k]!==d)return;
    var id=k.split('|')[0],r=S.recurring.filter(function(x){return x.id===id})[0];
    if(r)out.push({kind:'r',r:r,key:k,title:r.title,plate:r.plate,pr:r.pr||2,done:!!T.rdone[k],moved:true});
  });
  S.tasks.forEach(function(t){if(t.date&&t.date<=d&&(!t.done||t.doneOn===d))out.push({kind:'t',t:t,key:t.id,title:t.title,plate:t.plate,pr:t.pr||2,done:!!t.done,late:t.date<d,block:t.block||''})});
  return out.sort(function(a,b){return ((a.done?1:0)-(b.done?1:0))||(a.pr-b.pr)||(plateRank(a.plate)-plateRank(b.plate))});
}
function findDue(key){return dueToday().filter(function(x){return x.key===key})[0]}
function taskById(id){return S.tasks.filter(function(t){return t.id===id})[0]}
function recById(id){return S.recurring.filter(function(r){return r.id===id})[0]}
function target(){
  if(!sheet)return null;
  if(sheet.k){var x=findDue(sheet.k);return x?(x.kind==='r'?{kind:'r',r:x.r,key:sheet.k}:{kind:'t',t:x.t}):null}
  if(sheet.id){var t=taskById(sheet.id);return t?{kind:'t',t:t}:null}
  if(sheet.rid){var r=recById(sheet.rid);return r?{kind:'r',r:r}:null}
  return null;
}
function whenOf(t){var d=iso();return !t.date?'later':t.date<=d?'today':t.date===addDays(d,1)?'tomorrow':'later'}
function initForm(tg,rec){
  if(!tg)return {title:'',note:'',pr:2,plate:'',when:'today',rule:rec?{t:'w',days:[new Date().getDay()]}:null,from:'',start:iso(),orig:''};
  if(tg.kind==='t'){var t=tg.t;return {title:t.title,note:t.note||'',pr:t.pr||2,plate:t.plate||'',when:whenOf(t),rule:null,from:'',start:iso(),orig:t.date||'',block:t.block||''}}
  var r=tg.r,u=ruleOf(r);return {title:r.title,note:r.note||'',pr:r.pr||2,plate:r.plate||'',when:'today',rule:clone(u),from:r.from||'',start:(u.t==='m'||u.t==='y')?(nextDue(r)||iso()):iso(),orig:''};
}
function captureForm(){
  if(!sheet||!sheet.form)return;
  var f=sheet.form,a=document.getElementById('t-title'),n=document.getElementById('t-note'),s=document.getElementById('t-start');
  if(a)f.title=a.value;if(n)f.note=n.value;if(s&&s.value)f.start=s.value;
}
function saveTask(){
  captureForm();
  var f=sheet.form,tt=f.title.trim(),tg=target(),d=iso();
  if(!tt){toast('Type what needs doing');return}
  if(!tg&&!sheet.dupOk){var dp=findDup(tt);if(dp){sheet.dup=dp;renderSheet();return}}
  if(f.rule){
    var rule=clone(f.rule),from=f.from||'';
    if(rule.t==='w'&&!rule.days.length){toast('Pick at least one day');return}
    if(rule.t==='m'){rule={t:'m',dom:parseInt(f.start.slice(8),10)||1};from=f.start}
    if(rule.t==='y'){rule={t:'y',md:f.start.slice(5)};from=f.start}
    if(rule.t==='w')from='';
    if(tg&&tg.kind==='r'){tg.r.title=tt;tg.r.note=f.note;tg.r.pr=f.pr;tg.r.plate=f.plate;tg.r.rule=rule;tg.r.from=from}
    else{S.recurring.push({id:uid(),title:tt,note:f.note,pr:f.pr,plate:f.plate,rule:rule,from:from});if(tg)S.tasks=S.tasks.filter(function(z){return z!==tg.t})}
  }else{
    var date=f.when==='today'?d:f.when==='tomorrow'?addDays(d,1):(f.orig>addDays(d,1)?f.orig:'');
    var blk=f.when==='today'?(f.block||''):'';
    if(tg&&tg.kind==='t'){tg.t.title=tt;tg.t.note=f.note;tg.t.pr=f.pr;tg.t.plate=f.plate;tg.t.date=date;tg.t.block=blk}
    else{S.tasks.push({id:uid(),title:tt,note:f.note,pr:f.pr,plate:f.plate,date:date,block:blk});if(tg)S.recurring=S.recurring.filter(function(z){return z!==tg.r})}
  }
  persist('s');sheet=null;render();toast(tg?'Saved':'Added');
}

/* ---------- practice ---------- */
function day(d){return P.days[d]||{}}
function total(o){return (o.dissolve||0)+(o.sit||0)+(o.cp||0)+(o.unwind||0)+(o.anchor||0)}
function streak(){var n=0,d=new Date();if(!total(day(iso(d))))d.setDate(d.getDate()-1);while(total(day(iso(d)))>0){n++;d.setDate(d.getDate()-1)}return n}
function logPractice(k,extra){
  var d=iso();
  P.days[d]=P.days[d]||{};
  P.days[d][k]=(P.days[d][k]||0)+1;
  if(extra)P.days[d][extra]=(P.days[d][extra]||0)+1;
  var keys=Object.keys(P.days).sort();
  while(keys.length>90){delete P.days[keys.shift()]}
  persist('p');
}
function celebrate(label,sub,soft,icon){
  var old=document.querySelector('.cel');if(old)old.remove();
  var o=document.createElement('div');
  o.className='cel'+(soft?' soft':'');
  o.setAttribute('role','status');
  o.innerHTML='<div class="msg"><span class="bw"><span class="rg"><i></i><i></i><i></i></span><span class="badge">'+(icon||IC.check)+'</span></span><b>'+esc(label)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>';
  document.body.appendChild(o);
  function done(){if(!o.parentNode)return;o.classList.add('out');setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o)},350)}
  o.addEventListener('click',done);
  setTimeout(done,2200);
}
function stopTimers(){clearTimeout(dTimer);clearInterval(sTimer);dTimer=null;sTimer=null;SIT.run=false}

/* ---------- shared bits ---------- */
function topRow(){
  var planned=day(iso()).planned,sk=streak();
  var right=planned?(sk>0?'<span class="streak">'+IC.spark+sk+'</span>':''):'<button class="pillb" data-act="plan">'+IC.sun+'Plan my day</button>';
  return '<div class="topr"><span class="date">'+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</span><span class="tr">'+right+'<button class="ibtn ghost" data-act="settings" aria-label="Settings">'+IC.gear+'</button></span></div>';
}
function backRow(title,act,v){return '<div class="topr"><button class="ibtn ghost" data-act="'+act+'" data-v="'+(v||'')+'" aria-label="Back">'+IC.back+'</button></div>'}
function wheel(sel,act,count){
  var s='<svg class="wheel'+(sel?' has':'')+'" viewBox="0 0 240 240" role="group" aria-label="Emotion wheel">';
  CORES.forEach(function(c,i){
    var a0=i*60-30,a1=a0+60,mid=a0+30,on=sel===c.k,off=on?pol(0,0,8,mid):[0,0];

    case 'radd':var rd=v==='today'?'today':rDay,rr=routineFor(rd),last=rr.blocks.reduce(function(mx,x){return Math.max(mx,mins(x.start))},mins(rr.wake)),nb={id:uid(),start:hm(Math.min(last+60,mins(rr.sleep)-30)),name:'New block',plate:'',desc:'',items:[]};rr.blocks.push(nb);persistD(rd);sheet={t:'rblock',d:rd,id:nb.id};render();break;
    case 'rbplate':rb(1).plate=id;persistD(sheet.d);render();break;
    case 'riadd':var it=val('ri-new');if(it){var bb=rb(1);bb.items=(bb.items||[]).concat([it]);persistD(sheet.d);render();var rn=document.getElementById('ri-new');if(rn)rn.focus()}break;
    case 'ridel':var b3=rb(1);b3.items.splice(parseInt(b.getAttribute('data-i'),10),1);persistD(sheet.d);render();break;
    case 'rdup':var b4=rb(1),cp=clone(b4);cp.id=uid();cp.start=hm(mins(b4.start)+30);routineFor(sheet.d).blocks.push(cp);persistD(sheet.d);sheet={t:'rblock',d:sheet.d,id:cp.id};render();toast('Duplicated');break;
    case 'rdel':if(!sheet.sure){sheet.sure=true;renderSheet();break}var r4=routineFor(sheet.d);r4.blocks=r4.blocks.filter(function(x){return x.id!==sheet.id});persistD(sheet.d);sheet=null;render();break;
    case 'rcopy':sheet={t:'copy',d:rDay,to:[]};renderSheet();break;
    case 'ctog':var cd=parseInt(v,10),ci=sheet.to.indexOf(cd);if(ci>-1)sheet.to.splice(ci,1);else sheet.to.push(cd);renderSheet();break;
    case 'cset':sheet.to=(v==='wk'?[1,2,3,4,5]:v==='we'?[6,0]:[0,1,2,3,4,5,6]).filter(function(d){return d!==sheet.d});renderSheet();break;
    case 'cgo':var srcD=routine(sheet.d);sheet.to.forEach(function(d){var c=clone(srcD);c.blocks.forEach(function(x){x.id=uid()});S.week[String(d)]=c});persist('s');toast('Copied to '+sheet.to.map(function(d){return WD[d]}).join(', '));sheet=null;render();break;
    // settings: feelings and lists
    case 'fcore':fCore=v;render();break;
    case 'fdel':var arr=S.feel[fCore],fi=arr.indexOf(v);if(fi>-1)arr.splice(fi,1);persist('s');render();break;
    case 'fadd':var fv=val('f-new');if(fv&&S.feel[fCore].indexOf(fv)<0){S.feel[fCore].push(fv);persist('s');render();var fn=document.getElementById('f-new');if(fn)fn.focus()}break;
    case 'ldel':S[v].splice(parseInt(b.getAttribute('data-i'),10),1);persist('s');render();break;
    case 'ladd':var lv=val('l-'+v);if(lv&&S[v].indexOf(lv)<0){S[v].push(lv);persist('s');render();var ln=document.getElementById('l-'+v);if(ln)ln.focus()}break;
    // pause
    case 'tool':goTool(v);render();window.scrollTo(0,0);break;
    case 'hist':showHist=!showHist;render();break;
    case 'esheet':sheet={t:'entry',id:id};renderSheet();break;
    case 'edel':if(sheet.sure){J.entries=J.entries.filter(function(z){return z.id!==id});persist('j');sheet=null;render()}else{sheet.sure=true;renderSheet()}break;
    case 'dpick':D.text=v;D.before=7;D.phase='grip';render();break;
    case 'dready':D.phase='ready';render();break;
    case 'ddone':logPractice('dissolve');var db=D.before,da=D.after;D={text:'',style:'drift',phase:'pick',own:false};tool='menu';render();celebrate('Gone by','Grip '+db+' → '+da+' out of 10',true,IC.dissolve);break;
    case 'downt':D.own=!D.own;render();var dio=document.getElementById('dis-own');if(dio)dio.focus();break;
    case 'duse':var own=val('dis-own');if(!own){toast('Type the thought first');break}D.text=own;if(S.thoughts.indexOf(own)<0){S.thoughts.unshift(own);persist('s')}D.before=7;D.phase='grip';render();break;
    case 'dgo':D.style=v;D.phase='anim';render();var n=reframe(D.text).split(' ').length;clearTimeout(dTimer);dTimer=setTimeout(function(){D.after=D.before;D.phase='after';render()},4800+n*160+300);break;
    case 'score':SIT.core=SIT.core===v?'':v;render();break;
    case 'sstart':startSit();break;
    case 'sstop':stopTimers();render();break;
    case 'cpcore':CP.core=CP.core===v?'':v;CP.ownFeel=false;if(CP.core&&CP.int==null)CP.int=50;render();break;
    case 'slow':CP.slow=v;render();break;
    case 'cptog':CP[v]=true;render();break;
    case 'body':var bi=CP.body.indexOf(v);if(bi>-1)CP.body.splice(bi,1);else CP.body.push(v);render();break;
    case 'helper':var hl=CP.helpers.indexOf(v);if(hl>-1)CP.helpers.splice(hl,1);else CP.helpers.push(v);render();break;
    case 'cpwhen':CP.when=v;render();break;
    case 'ancore':AN.core=AN.core===v?'':v;render();break;
    case 'annext':if(AN.step<ANCHOR.length-1){AN.step++;render()}else{logPractice('anchor');tool='menu';render();celebrate('Anchored','Back in the room, here and now.',true,IC.anchor)}break;
    case 'anback':AN.step=Math.max(0,AN.step-1);render();break;
    case 'why':sheet={t:'why',k:v};renderSheet();break;
    case 'feel':var fi2=CP.feelings.indexOf(v);if(fi2>-1)CP.feelings.splice(fi2,1);else CP.feelings.push(v);render();break;
    case 'ownfeel':CP.ownFeel=!CP.ownFeel;render();var of=document.getElementById('own-feel');if(of)of.focus();break;
    case 'addfeel':var nf=val('own-feel');if(nf&&CP.core){if(S.feel[CP.core].indexOf(nf)<0){S.feel[CP.core].push(nf);persist('s')}if(CP.feelings.indexOf(nf)<0)CP.feelings.push(nf);CP.ownFeel=false;render()}break;
    case 'trap':CP.showTrap=true;render();break;
    case 'habit':var hi=CP.habits.indexOf(v);if(hi>-1){CP.habits.splice(hi,1);if(CP.lastHabit===v)CP.lastHabit=''}else{CP.habits.push(v);CP.lastHabit=v}render();break;
    case 'cpplate':CP.plate=CP.plate===id?'':id;render();break;
    case 'act':CP.action=CP.action===v?'':v;render();break;
    case 'ownact':CP.ownAct=!CP.ownAct;render();var oa=document.getElementById('own-act');if(oa)oa.focus();break;
    case 'addact':var na=val('own-act');if(na){if(S.actions.indexOf(na)<0){S.actions.unshift(na);persist('s')}CP.action=na;CP.ownAct=false;render()}break;
    case 'next':CP.step=Math.min(3,CP.step+1);render();window.scrollTo(0,0);break;
    case 'back':CP.step=Math.max(0,CP.step-1);render();break;
    case 'save':
      var feels=CP.feelings.length?CP.feelings.slice():(CP.core?[coreOf(CP.core).n]:[]),tw=v==='toward',i0=CP.int,i1=CP.after,act=CP.action,later=tw&&CP.when==='Later today';
      J.entries.push({id:'e'+Date.now(),t:Date.now(),feelings:feels,int:i0,after:i1,body:CP.body.slice(),habits:CP.habits.slice(),helpers:CP.helpers.slice(),plate:CP.plate,chose:tw?'toward':'away',next:tw?act:'',when:tw?CP.when:''});
      if(J.entries.length>150)J.entries=J.entries.slice(-150);
      if(later){var mm=dayModel(),nx2=mm.segs.filter(function(x){return x.s>mm.now})[0];S.tasks.push({id:uid(),title:act,plate:CP.plate,pr:2,date:iso(),block:nx2?nx2.b.name:'',note:'Towards move'});persist('s')}
      persist('j');logPractice('cp',tw?'toward':'away');
      CP=blankCP();tool='menu';render();window.scrollTo(0,0);
      var chg=(i0!=null&&i1!=null&&i1!==i0)?' · '+i0+'% → '+i1+'%':'';
      celebrate(tw?'Towards':'Noticed',tw?act+(later?' · on today’s list':'')+chg:'Noticing the hook is the first step.'+chg,!tw,tw?IC.toward:IC.sit);
      break;
  }
});

  var el=ev.target;if(el.type!=='range')return;
  var n=parseInt(el.value,10),sp=document.querySelector('[data-for="'+el.id+'"]');if(sp)sp.textContent=n;
  if(el.id==='g-before')D.before=n;if(el.id==='g-after')D.after=n;if(el.id==='cp-int')CP.int=n;if(el.id==='cp-after')CP.after=n;
});

  if(b){var c=t%9,x=c<2.5?'Breathe in':c<3.5?'Top up':'Long breath out';if(b.textContent!==x)b.textContent=x}
  if(a){var y=ACCEPT[Math.floor(t/4)%4];if(a.textContent!==y)a.textContent=y}

  if(t)t.textContent=dur(sp)+(tg?' of '+dur(tg)+' today':' today');

document.addEventListener('keydown',function(ev){
  var t=ev.target;

});
